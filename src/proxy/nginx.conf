events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name ~^(?<deployment_id>.+)\.msio\.local$;

        location / {
            # Proxy to S3 (assuming local Minio for MVP)
            # In production, this would be the S3 bucket URL
            set $s3_bucket "msio-deployments";
            set $s3_endpoint "http://minio:9000"; # Use internal network name if in docker, or localhost
            
            # Map request to S3 prefix
            rewrite ^/(.*)$ /msio-deployments/deployments/$deployment_id/$1 break;
            
            proxy_pass http://localhost:9000; # Local Minio endpoint
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_intercept_errors on;
            error_page 404 = /index.html;
        }
    }
}
